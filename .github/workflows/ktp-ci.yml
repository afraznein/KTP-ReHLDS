# KTP CI — build gate + header drift check across ALL THREE rehlds_api.h copies.
#
# Two jobs, both cheap, both meaningful:
#  - header-drift: rehlds_api.h is manually duplicated THREE times — this repo
#    (authoritative), KTP-ReAPI (a byte mirror) and KTPAMXX's
#    public/resdk/engine copy, which is compiled into both shipped KTPAMXX
#    artifacts including dodx. Drift between any of them produces silent
#    wrong-function calls with NO compile error (KTP hooks were historically
#    inserted mid-vtable). A failure here is ALWAYS treated as Critical.
#    KTP-ReAPI is byte-diffed. The KTPAMXX copy is deliberately SHORTER — it
#    lags the engine's appended tail — so it is checked as an ordinal PREFIX
#    instead, by .github/scripts/rehlds_api_prefix.py, over all three ordered
#    ABI surfaces (IRehldsHookchains, RehldsFuncs_t, IRehldsApi).
#    Each counterpart is compared against a same-named branch when one exists,
#    else its default branch. Both comparisons are unconditional either way,
#    and the run on main after merge still compares main against main.
#    KTPAMXX runs the reverse check on its own pushes (its Header Drift
#    workflow); this leg is what catches an engine-side change at the moment it
#    is made, rather than whenever KTPAMXX next happens to build.
#  - build-linux: compile gate only. Fleet binaries are built locally and
#    verified by md5 (builds are not reproducible) — the CI artifact is never
#    the deploy artifact. Its verify step names every artifact that has a deploy
#    path, so dropping one from the build is a red X rather than a quiet pass.
#
# The upstream workflow (build.yml, "C/C++ CI") triggers on master only and is
# not maintained for the KTP tree.

name: KTP CI

on:
  push:
    branches: [main, preprod]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, preprod]
  workflow_dispatch:
    inputs:
      reapi_ref:
        description: 'KTP-ReAPI ref to diff rehlds_api.h against. Blank = the same-named branch if it exists, else its default branch.'
        required: false
        type: string
        default: ''
      amxx_ref:
        description: 'KTPAMXX ref to prefix-check rehlds_api.h against. Blank = the same-named branch if it exists, else its default branch.'
        required: false
        type: string
        default: ''

jobs:
  header-drift:
    name: rehlds_api.h drift vs KTP-ReAPI + KTPAMXX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KTP-ReHLDS
        uses: actions/checkout@v6

      # Checking out the counterpart with no ref reads its DEFAULT branch, so a
      # coordinated header change on feature branches in both repos failed on both
      # sides until one merged. Prefer a same-named branch; else the default.
      - name: Resolve KTP-ReAPI ref
        id: counterpart
        env:
          COUNTERPART: https://github.com/afraznein/KTP-ReAPI.git
          OVERRIDE: ${{ inputs.reapi_ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            REF="$OVERRIDE"
            echo "dispatch override: $REF"
          elif [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$COUNTERPART" "refs/heads/$BRANCH" >/dev/null 2>&1; then
            REF="$BRANCH"
            echo "matched same-named branch on KTP-ReAPI: $REF"
          else
            REF=$(git ls-remote --symref "$COUNTERPART" HEAD | awk '/^ref:/ { sub("refs/heads/", "", $2); print $2; exit }')
            echo "no matching branch on KTP-ReAPI; using its default branch: $REF"
          fi
          # An empty ref makes checkout take the default branch, so a probe that
          # died would read as a passing comparison instead of a failure.
          test -n "$REF" || { echo "::error::could not resolve a KTP-ReAPI ref to compare against"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout KTP-ReAPI
        uses: actions/checkout@v6
        with:
          repository: afraznein/KTP-ReAPI
          ref: ${{ steps.counterpart.outputs.ref }}
          path: ktpreapi

      - name: Resolve KTPAMXX ref
        id: amxx
        env:
          COUNTERPART: https://github.com/afraznein/KTPAMXX.git
          OVERRIDE: ${{ inputs.amxx_ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            REF="$OVERRIDE"
            echo "dispatch override: $REF"
          elif [ -n "$BRANCH" ] && git ls-remote --exit-code --heads "$COUNTERPART" "refs/heads/$BRANCH" >/dev/null 2>&1; then
            REF="$BRANCH"
            echo "matched same-named branch on KTPAMXX: $REF"
          else
            REF=$(git ls-remote --symref "$COUNTERPART" HEAD | awk '/^ref:/ { sub("refs/heads/", "", $2); print $2; exit }')
            echo "no matching branch on KTPAMXX; using its default branch: $REF"
          fi
          test -n "$REF" || { echo "::error::could not resolve a KTPAMXX ref to compare against"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout KTPAMXX
        uses: actions/checkout@v6
        with:
          repository: afraznein/KTPAMXX
          ref: ${{ steps.amxx.outputs.ref }}
          path: ktpamxx

      - name: Diff the mirrored copy (KTP-ReAPI)
        run: |
          if diff -u rehlds/public/rehlds/rehlds_api.h ktpreapi/reapi/include/cssdk/engine/rehlds_api.h; then
            echo "rehlds_api.h copies are byte-identical (KTP-ReAPI @ ${{ steps.counterpart.outputs.ref }})"
          else
            echo "::error::rehlds_api.h has DRIFTED between KTP-ReHLDS and KTP-ReAPI. Vtable drift = silent wrong-function calls at runtime. Hook slots are APPEND-ONLY; sync both copies in the same change window. Compared against KTP-ReAPI @ ${{ steps.counterpart.outputs.ref }}."
            exit 1
          fi

      # Proves the checker can still fail before its verdict on the real files
      # is believed. A gate nobody has watched fail is not a gate.
      - name: Selftest the prefix checker
        run: python3 .github/scripts/rehlds_api_prefix.py --selftest

      # The version literals are the only runtime tie between the copies --
      # the handshake compares them and cannot see layout drift underneath.
      - name: Compare version macros (KTPAMXX)
        env:
          REF: ${{ steps.amxx.outputs.ref }}
        run: |
          set -euo pipefail
          macro() { tr -d '\r' < "$1" | grep -E "^#define REHLDS_API_VERSION_$2 " | tr -s ' \t' ' '; }
          for m in MAJOR MINOR; do
            e="$(macro rehlds/public/rehlds/rehlds_api.h "$m")"
            a="$(macro ktpamxx/public/resdk/engine/rehlds_api.h "$m")"
            test -n "$e" || { echo "::error::REHLDS_API_VERSION_$m not found in the engine copy -- dead probe"; exit 1; }
            test -n "$a" || { echo "::error::REHLDS_API_VERSION_$m not found in the KTPAMXX copy -- dead probe"; exit 1; }
            test "$e" = "$a" || { echo "::error::REHLDS_API_VERSION_$m differs: engine '$e', KTPAMXX '$a'. Bump them together or not at all. KTPAMXX @ $REF."; exit 1; }
          done
          echo "version macros agree (KTPAMXX @ $REF)"

      - name: Prefix-check the bundled copy (KTPAMXX)
        run: |
          python3 .github/scripts/rehlds_api_prefix.py \
            --engine rehlds/public/rehlds/rehlds_api.h \
            --consumer ktpamxx/public/resdk/engine/rehlds_api.h \
            --require GetHookchains \
            --require SV_UpdatePausedHUD \
            --require SV_ShouldSendConsistencyList \
            --require PF_TraceLine \
            --require MSG_ReadUsercmd \
          || { echo "::error::rehlds_api.h in KTPAMXX is no longer an ordinal prefix of the engine's. dodx binds by vtable slot and struct offset, so this is a silent wrong-function call on a fleet-wide module, not a build error. Compared against KTPAMXX @ ${{ steps.amxx.outputs.ref }}."; exit 1; }

      # ktp_rewind_api.h is a byte mirror, like the ReAPI copy above. The engine
      # merges first, so a KTPAMXX ref without the file is reported, not failed;
      # a copy that exists and differs always fails.
      - name: Diff the mirrored ktp_rewind_api.h (KTPAMXX)
        env:
          REF: ${{ steps.amxx.outputs.ref }}
        run: |
          set -euo pipefail
          src=rehlds/public/rehlds/ktp_rewind_api.h
          dst=ktpamxx/public/resdk/engine/ktp_rewind_api.h
          test -f "$src" || { echo "::error::$src missing from the engine -- dead probe"; exit 1; }
          if [ ! -f "$dst" ]; then
            echo "::warning::KTPAMXX @ $REF does not carry ktp_rewind_api.h yet; nothing to diff."
            exit 0
          fi
          if diff -u "$src" "$dst"; then
            echo "ktp_rewind_api.h copies are byte-identical (KTPAMXX @ $REF)"
          else
            echo "::error::ktp_rewind_api.h has DRIFTED between KTP-ReHLDS and KTPAMXX @ $REF. The struct is read across the module boundary by layout; a change is a new ktp_rewind_vN name, never an edit."
            exit 1
          fi

  engine-unittests:
    name: Engine unit tests (cppunitlite)
    runs-on: ubuntu-latest
    # debian:11 for glibc 2.31. The bundled rehlds/lib/linux32/librt.so stub
    # references __libc_dlopen_mode, a GLIBC_PRIVATE symbol dropped in glibc
    # 2.34, so the Unittests link fails on a modern runner.
    container: debian:11-slim
    steps:
      - name: Install toolchain
        run: |
          # Debian 11 is EOL. Three failures stack here and each one hides the
          # next, so all three are handled at once:
          #   1. deb.debian.org Release is expired  -> update exits 100
          #   2. its .debs are gone                 -> install 404s
          #   3. archive.debian.org has NO bullseye-security Release at all
          # The image already ships the answer: commented snapshot.debian.org
          # lines pinned to a timestamp, which is the supported route for an EOL
          # base and serves both main and security at that date.
          # The debian:11 pin itself stays -- glibc 2.31 is required for the
          # Unittests link (see above).
          sed -i -e 's|^# deb http://snapshot|deb http://snapshot|' \
                 -e '\|^deb http://deb.debian.org|d' \
                 -e '\|^deb http://archive.debian.org|d' \
                 /etc/apt/sources.list
          cat /etc/apt/sources.list
          # Snapshots are historical by definition, so the validity check must go.
          apt-get -o Acquire::Check-Valid-Until=false update -qq
          # snapshot.debian.org resets connections under apt default parallelism:
          #   Error reading from server - read (104: Connection reset by peer)
          # consistently on the multilib/x32 packages, and a plain re-run did not
          # clear it. Serialise the queue and retry rather than hammer the mirror.
          apt-get -o Acquire::Retries=5 -o Acquire::Queue-Mode=access install -y -qq cmake gcc g++ gcc-multilib g++-multilib make git

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # appversion.sh derives the build number from git history

      - name: Configure and build
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tr -d '\015' < rehlds/version/appversion.sh > /tmp/av.sh
          mv /tmp/av.sh rehlds/version/appversion.sh
          chmod +x rehlds/version/appversion.sh
          # -pthread: libstdc++ pulls pthread_join but the 32-bit link line
          # omits libpthread, so the executable target fails to link.
          cmake -S . -B build-ut -DCMAKE_BUILD_TYPE=Unittests -DCMAKE_EXE_LINKER_FLAGS=-pthread
          make -C build-ut -j"$(nproc)"

      - name: Run
        run: |
          set -e
          # Unittests swaps the engine from a shared library to an executable
          # linked against cppunitlite, so the binary IS the test runner.
          # The target is `engine`; the artifact is `engine_i486`.
          test -x build-ut/rehlds/engine_i486 || { echo "::error::unittest binary missing"; exit 1; }
          # libsteam_api.so ships in the repo, not on the system loader path.
          LD_LIBRARY_PATH="$PWD/rehlds/lib/linux32" ./build-ut/rehlds/engine_i486

  build-linux:
    name: Linux GCC 32-bit build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # appversion.sh derives the build number from git history

      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake gcc-multilib g++-multilib

      - name: Build
        run: |
          sed -i 's/\r$//' build.sh rehlds/version/appversion.sh
          chmod +x build.sh rehlds/version/appversion.sh
          bash build.sh -j=$(nproc)

      - name: Verify artifacts
        run: |
          set -e
          test -f build/rehlds/engine_i486.so || { echo "::error::engine_i486.so missing"; exit 1; }
          find build -name hlds_linux | grep -q . || { echo "::error::hlds_linux missing"; exit 1; }
          # Asserted by NAME, not by walking what the build happened to emit --
          # a sweep over present files passes cleanly when a target is dropped.
          test -f build/rehlds/HLTV/Proxy/proxy.so || { echo "::error::proxy.so missing -- the HLTV proxy is a deploy artifact, see build_linux.sh"; exit 1; }
          file build/rehlds/engine_i486.so | grep -q 'ELF 32-bit' || { echo "::error::engine is not 32-bit ELF"; exit 1; }
          file build/rehlds/HLTV/Proxy/proxy.so | grep -q 'ELF 32-bit' || { echo "::error::proxy.so is not 32-bit ELF"; exit 1; }
          echo "Artifacts OK:"
          ls -la build/rehlds/engine_i486.so build/rehlds/HLTV/Proxy/proxy.so

      # The 32-bit build already produces and verifies these; without an upload
      # they are discarded when the runner is torn down. KTPInfrastructure#235
      # needs a candidate engine to boot Lane B against, and the engine is the
      # one fleet artifact with no rollback copy -- so it is the one most worth
      # smoking before it reaches a server.
      #
      # Retention is short on purpose: this is a smoke input, not a release
      # channel, and `.so` files are not byte-reproducible (build-id + __DATE__),
      # so a stale artifact must never be mistaken for a rebuildable one.
      - name: Upload engine + proxy for downstream smoke
        uses: actions/upload-artifact@v4
        with:
          name: rehlds-engine-${{ github.sha }}
          path: |
            build/rehlds/engine_i486.so
            build/rehlds/HLTV/Proxy/proxy.so
          if-no-files-found: error
          retention-days: 14
